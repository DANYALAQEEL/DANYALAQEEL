<svg xmlns="http://www.w3.org/2000/svg" width="450" height="370" viewBox="0 0 450 370">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
      .header-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; font-weight: 700; fill: #8b949e; }
      .text-prompt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14.5px; font-weight: 800; fill: #10b981; }
      .text-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; fill: #f0883e; }
      .text-val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #c9d1d9; }
      .text-val-bright { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #58a6ff; }
      .text-highlight { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #10b981; }
      .text-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-weight: 700; fill: #8b949e; }
      .footer-prompt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; fill: #58a6ff; }
      .line { stroke: #21262d; stroke-width: 1px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="449" height="369" rx="10" ry="10" class="bg" />
  <rect x="1" y="1" width="448" height="33" fill="#161b22" rx="9.5" ry="9.5" />
  <rect x="1" y="24" width="448" height="10" fill="#161b22" />
  <circle cx="16" cy="17" r="5" fill="#ff5f56" />
  <circle cx="32" cy="17" r="5" fill="#ffbd2e" />
  <circle cx="48" cy="17" r="5" fill="#27c93f" />
  <text x="225" y="22" text-anchor="middle" class="header-title">danyal@github: ~$ neofetch</text>
  <line x1="0" y1="34" x2="450" y2="34" stroke="#30363d" stroke-width="1" />

  <g transform="translate(20, 48)">
    <!-- Line 1: User Prompt -->
    <text x="0" y="20" class="text-prompt">danyal@github</text>
    <line x1="0" y1="30" x2="410" y2="30" class="line" />

    <!-- Line 2: Now -->
    <text x="0" y="55" class="text-label">Now</text>
    <text x="85" y="55" class="text-val-bright">Backend &amp; Search Architect | Resilience Eng.</text>

    <!-- Line 3: Edu -->
    <text x="0" y="78" class="text-label">Edu</text>
    <text x="85" y="78" class="text-val">B.S. Software Engineering @ NUST SEECS (&apos;26)</text>

    <!-- Divider 1 -->
    <text x="0" y="105" class="text-sub">Stack</text>
    <line x1="50" y1="101" x2="410" y2="101" class="line" />

    <!-- Stack Items -->
    <text x="0" y="128" class="text-label">Backend</text>
    <text x="85" y="128" class="text-val">Python, C++, Java, Node.js, FastAPI, Redis</text>

    <text x="0" y="150" class="text-label">Search &amp; IR</text>
    <text x="85" y="150" class="text-val">Vector Search, RAG Pipelines, Elasticsearch</text>

    <text x="0" y="172" class="text-label">DevSecOps</text>
    <text x="85" y="172" class="text-val">Docker, CI/CD Pipelines, Git Automation</text>

    <!-- Divider 2 -->
    <text x="0" y="202" class="text-sub">Highlights</text>
    <line x1="85" y1="198" x2="410" y2="198" class="line" />

    <!-- Highlights -->
    <text x="0" y="226" class="text-highlight">• Decoupled Serverless Engine Architecture</text>
    <text x="0" y="248" class="text-highlight">• High-Availability IR &amp; Vector Search Indexing</text>
    <text x="0" y="270" class="text-highlight">• Custom C++ WebAssembly Game Engines</text>
  </g>

  <text x="20" y="356" class="footer-prompt">danyal@github: ~$ uptime --status ONLINE</text>
</svg>
