      .text-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; fill: #f0883e; }
      .text-val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #c9d1d9; }
      .text-val-bright { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #58a6ff; }
      .text-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-weight: 700; fill: #8b949e; }
      .line { stroke: #21282d; stroke-width: 1px; }
    </style>
  </defs>

  <rect width="450" height="370" class="bg" />
  <rect x="0" y="0" width="450" height="34" fill="#161b22" rx="10" ry="10" />
