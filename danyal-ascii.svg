  <circle cx="48" cy="17" r="5" fill="#27c93f" />
  <text x="205" y="22" text-anchor="middle" class="header-title">danyal@github: ~$ ./portrait.sh</text>
  <line x1="0" y1="34" x2="410" y2="34" stroke="#30363d" stroke-width="1" />

