<svg xmlns="http://www.w3.org/2000/svg" width="410" height="370" viewBox="0 0 410 370">
  <defs>
    <style>
      @keyframes wipeIn {
        0% { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); opacity: 0; }
        15% { opacity: 1; }
        100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 1; }
      }
      @keyframes phosphorPulse {
        0%, 100% { fill: #10b981; filter: drop-shadow(0 0 1px rgba(16, 185, 129, 0.4)); }
        50% { fill: #34d399; filter: drop-shadow(0 0 4px rgba(52, 211, 153, 0.8)); }
      }
      @keyframes phosphorPulseAlt {
        0%, 100% { fill: #059669; filter: drop-shadow(0 0 1px rgba(5, 150, 105, 0.3)); }
        50% { fill: #10b981; filter: drop-shadow(0 0 3px rgba(16, 185, 129, 0.7)); }
      }
      @keyframes scanBeam {
        0% { transform: translateY(34px); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(346px); opacity: 0; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1px; }
      .header-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; font-weight: 700; fill: #8b949e; }
      .row { animation: wipeIn 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8.5px; font-weight: 700; fill: #10b981; letter-spacing: 0.5px; white-space: pre; }
      .row-odd text { animation: phosphorPulse 3s ease-in-out infinite; }
      .row-even text { animation: phosphorPulseAlt 3s ease-in-out infinite 1.5s; }
      .footer-prompt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; fill: #58a6ff; }
      .cursor { fill: #10b981; animation: cursorBlink 1s steps(1) infinite; }
      .scanline-beam { animation: scanBeam 3.5s ease-in-out infinite; mix-blend-mode: screen; pointer-events: none; }
    </style>

    <linearGradient id="scanlineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
  </defs>

